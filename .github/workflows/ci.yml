name: CI

# Run by hand while the repo is private, to save Actions minutes. Vercel builds
# and deploys the site itself. At launch, add:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the site can tell when each page last changed.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tests, typecheck, lint, the docs' links and build, and the examples.
      - run: bash scripts/verify.sh

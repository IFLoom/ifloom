name: CI

# On every push to main and every pull request, and by hand. Vercel builds and
# deploys the site itself, from IFLoom/ifloom-site. The docs' check needs that
# repo too: SITE_TOKEN is a secret that can read it while it's private.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the site can tell when each page last changed.
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: IFLoom/ifloom-site
          token: ${{ secrets.SITE_TOKEN }}
          path: ifloom-site
      # Beside this checkout, as it sits locally, so neither repo's format and lint settings reach into the other.
      - run: mv ifloom-site ../ifloom-site
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every package's dist/, as a game installed from npm gets it.
      - run: npm run build
      # Tests, the format, lint and typecheck (vp check, tsc), the docs' links and build, and the examples, all from src/.
      - run: bash scripts/verify.sh --full
      # The built packages, used as their users will: plain Node, and a type-check against the .d.ts files.
      - run: bash scripts/try-dist.sh --no-build

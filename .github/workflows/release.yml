name: Release

# Publishes every package to npm (scripts/publish.ts), each after the packages it uses.
#
# - A tag v<version> publishes, once the tag matches the version in the root package.json
#   (set with `node scripts/version.ts <version>`).
# - By hand, it's a dry run unless dry_run is turned off: `npm publish --dry-run` for each
#   package, which lists each tarball's files. Turning it off publishes only from such a tag.
#
# npm signs in with the NPM_TOKEN secret while it's set (the first release, before the
# packages exist on npm). Without it, NODE_AUTH_TOKEN is empty and npm uses trusted publishing,
# with this workflow named as each package's trusted publisher on npmjs.com.
# A version already on npm is skipped, so a failed run can be run again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run for each package, and publish nothing
        type: boolean
        default: true

permissions:
  contents: read
  # Trusted publishing and provenance: npm swaps the workflow's OIDC token for its own.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - name: Check the tag names the version
        if: env.DRY_RUN != 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Publishing needs the tag v$version, the root package.json's version; this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
            exit 1
          fi
      - run: npm ci
      # Every package's dist/, as it will be published.
      - run: npm run build
      # The built packages, used as their users will: plain Node, a type-check against the .d.ts files, and npx ifloom.
      - run: bash scripts/try-dist.sh --no-build
      # A game from each template, installed from the packed tarballs, checked, playtested, built and type-checked.
      - run: bash scripts/try-templates.sh --pm npm
      - name: Publish
        run: node scripts/publish.ts ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
